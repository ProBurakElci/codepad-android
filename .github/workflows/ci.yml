name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No setup-android step: the runner already ships the SDK at
      # $ANDROID_HOME, and the action that installs one tries to fetch the
      # long-obsolete "tools" package and dies. Gradle downloads whatever
      # platform this project needs on its own.
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      # The unit tests are plain JVM - no emulator, no device.
      - run: ./gradlew test --stacktrace

      # And the app has to actually build.
      - run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: codepad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
